<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scale-in fixture</title>
<style>
  /* A scale animation, deliberately: a uniform scale shows up in the tracker as TWO
     matrix axes (scaleX and scaleY) while the stylesheet declares ONE `scale`. That gap
     is what the verify stillness check has to tolerate, and this fixture is the only
     page in the suite that exercises it. */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101014;
    color: #eee;
    font-family: system-ui, sans-serif;
  }
  .stage { display: flex; gap: 20px; }

  .tile {
    width: 120px;
    height: 120px;
    border-radius: 16px;
    background: #4f7cff;
    opacity: 0;
    transform: scale(0.6);
    animation-name: pop-in;
    animation-duration: 800ms;
    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    animation-fill-mode: both;
    animation-delay: 0ms;
  }
  .tile:nth-child(2) { animation-delay: 110ms; }
  .tile:nth-child(3) { animation-delay: 220ms; }

  @keyframes pop-in {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="tile"></div>
    <div class="tile"></div>
    <div class="tile"></div>
  </div>
</body>
</html>
