<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>canvas-2d fixture</title>
<!--
  EXPECTED VALUES — the determinism fixture
  ----------------------------------------------------------------
  A 2D canvas animation drawn on requestAnimationFrame, driven only by the
  time value the clock hands us (performance.now()). No Math.random: every
  random number comes from a seeded mulberry32 PRNG with seed 12345, so the
  layout of the orbiting dots is identical on every run and every machine.

  Under `--clock virtual` frame k is drawn at t = k / fps exactly, so
    sha256(frames/0000.png .. frames/NNNN.png)
  must be byte-identical between two runs with the same --seed. That is the
  headline guarantee this page exists to prove.

    seed        : 12345  (fixed in this file, independent of --seed)
    fps         : whatever the capture asks for
    duration    : whatever the capture asks for
    draw        : 9 orbiters, position = f(t) only, plus a progress arc
    pixel-stable: no anti-aliasing-dependent text, no fonts, integer geometry
                  where possible, and devicePixelRatio is pinned to 1 by the
                  canvas backing-store size below.

  IMPORTANT: the page reads time ONLY from performance.now(). It never uses
  Date.now() for drawing, never uses Math.random() after the seeded PRNG is
  installed, and never depends on wall-clock elapsed time.
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; }
  canvas { display: block; }
</style>
</head>
<body>
  <canvas id="c" width="640" height="480"
          data-anim="canvas-orbit" data-seed="12345"></canvas>
  <script>
    (function () {
      // ---- seeded PRNG: mulberry32, deterministic across engines -----------
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(12345);

      const c = document.getElementById("c");
      const ctx = c.getContext("2d", { alpha: false });
      const W = c.width, H = c.height;
      const CX = W / 2, CY = H / 2;

      // Fixed layout, generated once from the seeded PRNG. Never regenerated
      // per frame, so the only per-frame input is t.
      const N = 9;
      const dots = [];
      for (let i = 0; i < N; i++) {
        dots.push({
          radius: 70 + i * 14,               // integer ring radii
          phase: rnd() * Math.PI * 2,        // fixed per dot
          speed: 0.0009 + i * 0.00012,       // radians per ms
          size: 5 + (i % 3) * 2,             // 5, 7, 9
          hue: Math.round(rnd() * 360),
        });
      }

      const START = performance.now();

      function draw(t) {
        // Background is painted every frame: no accumulation, no clearRect gaps.
        ctx.fillStyle = "#0b1020";
        ctx.fillRect(0, 0, W, H);

        // Progress arc: a pure function of t in [0, 2000ms], clamped.
        const p = Math.max(0, Math.min(1, t / 2000));
        ctx.beginPath();
        ctx.strokeStyle = "#2b6cb0";
        ctx.lineWidth = 6;
        ctx.arc(CX, CY, 40, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2, false);
        ctx.stroke();

        // Orbiters: angle = phase + speed * t. Integer-rounded centres keep
        // the rasterisation identical between runs.
        for (let i = 0; i < N; i++) {
          const d = dots[i];
          const a = d.phase + d.speed * t;
          const x = Math.round(CX + Math.cos(a) * d.radius);
          const y = Math.round(CY + Math.sin(a) * d.radius);
          ctx.beginPath();
          ctx.fillStyle = "hsl(" + d.hue + " 70% 60%)";
          ctx.arc(x, y, d.size, 0, Math.PI * 2, false);
          ctx.fill();
        }

        // Frame counter bars: 12 discrete bars, one per 1/12 of the 2000ms
        // window, so a test can tell which frames actually differ.
        const step = Math.floor(Math.min(11, (t / 2000) * 12));
        for (let b = 0; b <= step; b++) {
          ctx.fillStyle = "#e2e8f0";
          ctx.fillRect(20 + b * 12, H - 30, 8, 16);
        }
      }

      function loop() {
        const t = performance.now() - START;
        draw(t);
        requestAnimationFrame(loop);
      }
      // Draw frame 0 synchronously so the very first captured frame is
      // already a real frame and not a blank canvas.
      draw(0);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
